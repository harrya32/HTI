hydra:
  run:
    dir: ./exp/local/${now:%Y.%m.%d}/${now:%H%M}.${geometry}
  sweep:
    dir: ./exp/${now:%Y.%m.%d}/${now:%H%M}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=MULTIRUN
    task:
    - geometry=sq_euclidean_manifold
    - seed=6,7,8,9,10
  job:
    name: train_ot_scarvelis
    chdir: true
    override_dirname: geometry=sq_euclidean_manifold,seed=6,7,8,9,10
    id: ???
    num: ???
    config_name: train_ot_scarvelis.yaml
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.1'
    cwd: /home/azureuser/localfiles/HTI/NLOT
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/azureuser/localfiles/HTI/NLOT
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
geometry: sq_euclidean_manifold
data: reward_weighting_data
D: 2
C: 7
categorical: false
num_categories: 4
include_land_potential: false
include_inverse_potential: true
bandwidth: 1.0
conditional_bandwidth: 1.0
lambda: 0.0001
seed: 0
num_pairs: 2
num_train_iters: 2001
batch_size: 1024
potential_lr: 0.0001
wandb: true
plot_frequency: 50
save_frequency: ${plot_frequency}
plotting:
  disable: false
  num_pairs_plot: 100
metric:
  warmup_steps: 50
  update_frequency: 10
  update_repeat: 1
  frobenius_reg_weight: 0
  lr: 0.005
geometry_kwargs:
  spline_solver_kwargs:
    num_spline_nodes: 15
    grad_tol: 1.0e-05
    init_lr: 0.01
    num_spline_points_eval: 50
    max_iter: 0
ctransform_solver:
  _target_: lagrangian_ot.ctransform_solvers.CTransformLBFGS
  gtol: 1.0e-05
  max_iter: 3
  max_linesearch_iter: 20
  linesearch_type: backtracking
spline:
  init_train_iters: 1001
  train_iters: 1001
  update_frequency: 25
  grad_norm_threshold: 0.0001
  noise: 0.0
  update_on_conjugates: false
target_potential_dim_hidden:
- 64
- 64
- 64
- 64
source_map_dim_hidden:
- 64
- 64
- 64
- 64
