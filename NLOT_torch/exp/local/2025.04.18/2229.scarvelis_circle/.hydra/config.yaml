seed: 0
num_train_iters: 3001
batch_size: 1024
potential_lr: 0.0001
plot_frequency: 100
save_frequency: ${plot_frequency}
metric:
  warmup_steps: 50
  update_frequency: 10
  update_repeat: 1
  lr: 0.005
geometry: scarvelis_circle
data: scarvelis_xpath
geometry_kwargs:
  spline_solver_kwargs:
    num_spline_nodes: 30
    grad_tol: 1.0e-05
    init_lr: 0.01
    num_spline_points_eval: 20
    max_iter: 0
ctransform_solver:
  _target_: lagrangian_ot.ctransform_solvers.CTransformLBFGS
  gtol: 1.0e-05
  max_iter: 20
  max_linesearch_iter: 20
  linesearch_type: backtracking
spline:
  init_train_iters: 1001
  train_iters: 1001
  update_frequency: 25
  grad_norm_threshold: 0.0001
  noise: 0.0
  update_on_conjugates: true
target_potential_dim_hidden:
- 64
- 64
- 64
- 64
source_map_dim_hidden:
- 64
- 64
- 64
- 64
